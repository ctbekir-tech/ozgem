<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uç Özgem">
<meta name="theme-color" content="#fbead8">
<title>Uç Özgem</title>
<link id="appleIcon" rel="apple-touch-icon" href="">
<link id="tabIcon" rel="icon" href="">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    overscroll-behavior: none;
    background: #2b1b3d;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    user-select: none;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    overflow: hidden;
    background: #ffc2dd;
    touch-action: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    color: #fff;
    text-align: center;
    background: rgba(58, 25, 74, .45);
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(27px, 7.5vw, 42px);
    line-height: 1.15;
    color: #fff0a8;
    text-shadow: 3px 3px 0 #b8286b, 0 0 20px rgba(255,120,180,.7);
    letter-spacing: 1px;
  }
  .overlay h1 .isim { color: #7ef9ff; text-shadow: 3px 3px 0 #146b9c, 0 0 20px rgba(90,220,255,.6); }
  .overlay p { font-size: 16px; text-shadow: 1px 1px 3px #4a1240; }
  .btn {
    margin-top: 8px;
    padding: 13px 30px;
    font: bold 20px 'Trebuchet MS', sans-serif;
    color: #8b1e52;
    background: linear-gradient(#fff3a6, #ffb3d1);
    border: 3px solid #fff;
    border-radius: 14px;
    box-shadow: 0 5px 0 #b8286b, 0 8px 16px rgba(0,0,0,.35);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b8286b; }
  .small { font-size: 13px; opacity: .9; line-height: 1.6; }
  .heart { color: #ff8fb8; }
  .back-link {
    position: absolute;
    top: calc(28px + env(safe-area-inset-top, 0px));
    right: 12px;
    z-index: 6;
    padding: 7px 13px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .88);
    color: #8b1e52;
    text-decoration: none;
    font: bold 12px 'Trebuchet MS', sans-serif;
    box-shadow: 0 3px 10px rgba(90, 15, 56, .22);
  }
  .back-link:active { transform: scale(.95); }
  .sound-btn {
    position: absolute;
    top: calc(28px + env(safe-area-inset-top, 0px));
    left: 12px;
    z-index: 6;
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: 2px solid #fff;
    background: rgba(255, 255, 255, .88);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(90, 15, 56, .22);
  }
  .sound-btn:active { transform: scale(.94); }

</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>
  <a id="backToOzgem" class="back-link" href="index.html" title="Özgem oyununa dön">← Özgem</a>
  <button id="soundToggle" class="sound-btn" type="button" title="Ses: tam" aria-label="Ses: tam">🔊</button>
  <button id="pauseToggle" class="sound-btn" style="left:58px;" type="button" title="Duraklat" aria-label="Duraklat">⏸</button>

  <div id="startScreen" class="overlay">
    <p class="small" style="color:#fff0a8; font-weight:bold; letter-spacing:2px; font-size:15px;">UÇ ÖZGEM</p>
    <h1>İYİ Kİ DOĞDUN<br><span class="isim">ÖZGE!</span></h1>
    <p class="small">Zıplamak için boşluk tuşuna bas veya ekrana dokun.</p>
    <button id="startBtn" class="btn">BAŞLA</button>
    <p id="startBest" class="small" style="color:#fff0a8;">En iyi: 0</p>
    <p class="small" style="font-size:11px; opacity:.6;">sürüm 4</p>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color:#ffd1e6; text-shadow:3px 3px 0 #8b1e52;">OYUN BİTTİ</h1>
    <p>Puan: <b id="finalScore">0</b> &nbsp;|&nbsp; En iyi: <b id="bestScore">0</b></p>
    <p id="newRecord" class="small" style="color:#fff0a8; display:none;">Yeni rekor!</p>
    <button id="restartBtn" class="btn">TEKRAR</button>
  </div>

  <div id="pauseOverlay" class="overlay hidden" style="background:rgba(58,25,74,.62);">
    <h1 style="color:#ffd1e6; text-shadow:3px 3px 0 #8b1e52;">DURAKLATILDI</h1>
    <p class="small">Bir nefes al, devam etmeye hazır olduğunda dokun.</p>
    <button id="resumeBtn" class="btn">DEVAM ET</button>
  </div>
</div>

<script>
(function () {
  // ---- Ana ekran / sekme simgesi: doğum günü temalı kuş ----
  (function setAppIcon() {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 180, 180);
    bg.addColorStop(0, '#fff0f6');
    bg.addColorStop(1, '#ff9ec4');
    g.fillStyle = bg;
    g.fillRect(0, 0, 180, 180);

    g.save();
    g.translate(86, 100);
    g.globalAlpha = 0.18;
    g.fillStyle = '#7a0d38';
    g.beginPath(); g.ellipse(4, 6, 52, 42, 0, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = '#ffd43b';
    g.strokeStyle = '#a05a00';
    g.lineWidth = 5;
    g.beginPath(); g.ellipse(0, 0, 50, 40, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(20, -13, 19, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#000';
    g.beginPath(); g.arc(26, -13, 7, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ff922b';
    g.beginPath(); g.moveTo(-46, 2); g.lineTo(-82, 12); g.lineTo(-46, 24); g.closePath(); g.fill(); g.stroke();
    g.restore();

    g.save();
    g.translate(140, 44);
    g.fillStyle = '#e91e63';
    g.beginPath();
    g.moveTo(0, 17);
    g.bezierCurveTo(-25, 2, -21, -17, -8, -17);
    g.bezierCurveTo(-2, -17, 0, -12, 0, -10);
    g.bezierCurveTo(0, -12, 2, -17, 8, -17);
    g.bezierCurveTo(21, -17, 25, 2, 0, 17);
    g.fill();
    g.restore();

    const data = c.toDataURL('image/png');
    const apple = document.getElementById('appleIcon');
    const tab = document.getElementById('tabIcon');
    if (apple) apple.href = data;
    if (tab) tab.href = data;
  })();

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('gameWrap');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const soundToggle = document.getElementById('soundToggle');
  const pauseToggle = document.getElementById('pauseToggle');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const resumeBtn = document.getElementById('resumeBtn');
  const startBestEl = document.getElementById('startBest');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const newRecordEl = document.getElementById('newRecord');
  const scoreBackLink = document.getElementById('backToOzgem');

  // Dünya hep 400 birim genişliğinde; yükseklik ekran oranına göre değişir.
  // Böylece görsel gerilmez (eski sürümde 400x640 canvas 414x896 ekrana geriliyordu).
  const W = 400;
  let H = 640, scale = 1, dpr = 1, pipeGrad = null, bgCanvas = null;
  let maxDpr = 2, lowQuality = false;
  let scoreDrawY = 105;

  // Skor, üstteki ← Özgem / ses / duraklat düğmelerinin altına gelecek şekilde ortalanır.
  function updateScorePosition() {
    if (!scoreBackLink) return;
    const topPx = parseFloat(getComputedStyle(scoreBackLink).top) || 28;
    const heightPx = scoreBackLink.offsetHeight || 30;
    scoreDrawY = (topPx + heightPx + 26) / scale;
  }

  function resize() {
    // iOS'ta clientWidth bazen geç/hatalı gelir. Canvas'ın gerçek çizilen kutusunu
    // ölçmek en güvenilir yol; böylece görsel ne gerilir ne de yatayda basık kalır.
    const rect = canvas.getBoundingClientRect();
    const cssW = rect.width || wrap.clientWidth || window.innerWidth || W;
    const cssH = rect.height || wrap.clientHeight || window.innerHeight || H;
    const oldH = H;

    // Retina çözünürlük korunur, gereksiz 3x/4x canvas yükü engellenir.
    dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));

    scale = cssW / W;
    H = cssH / scale;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

    // Boru gradyanı önbellekte; her kare yeniden oluşturulmuyor.
    pipeGrad = ctx.createLinearGradient(0, 0, PIPE_W, 0);
    pipeGrad.addColorStop(0, '#c2185b');
    pipeGrad.addColorStop(.25, '#ff6b9d');
    pipeGrad.addColorStop(.7, '#e91e63');
    pipeGrad.addColorStop(1, '#9c1446');

    // Sabit arka planı (gökyüzü + tepeler) bir kez çiz, her kare sadece kopyala.
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;
    const bg = bgCanvas.getContext('2d');
    bg.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    if (lowQuality) {
      bg.fillStyle = '#ffd9ec';
    } else {
      const g = bg.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#ffb6d9');
      g.addColorStop(.55, '#ffd9ec');
      g.addColorStop(1, '#ffeaf4');
      bg.fillStyle = g;
    }
    bg.fillRect(0, 0, W, H);
    bg.fillStyle = 'rgba(255,143,184,.35)';
    bg.beginPath();
    bg.moveTo(0, H - 70);
    bg.quadraticCurveTo(60, H - 125, 130, H - 70);
    bg.quadraticCurveTo(210, H - 110, 280, H - 70);
    bg.quadraticCurveTo(350, H - 120, W, H - 70);
    bg.lineTo(W, H); bg.lineTo(0, H); bg.closePath(); bg.fill();

    // Yön değişirse nesneleri yeni yüksekliğe orantılı taşı.
    if (bird && oldH !== H) {
      const f = H / oldH;
      bird.y *= f;
      for (const p of pipes) p.top *= f;
      for (const c of clouds) c.y *= f;
    }
    updateScorePosition();
  }

  // ---- Özge'nin kuşu: şeffaf kafa görseli, yoksa yedek, o da yoksa yerleşik çizim ----
  const BIRD_IMAGE = 'kus.png';     // Şeffaf kafa görseli (512x512)
  const BIRD_FALLBACK = 'kus.jpg';  // Eski dosya yedek
  const BIRD_FIT = 'contain';       // contain = kırpmaz, cover = ortadan kare kırpar
  const birdImg = new Image();
  let birdReady = false;
  let birdBox = null;               // Şeffaf kenarlar otomatik kırpılır

  function measureBirdBox() {
    try {
      // 512x512 piksel taramak telefonu açılışta kastırıyordu; 128'e indirip tara.
      const nw = birdImg.naturalWidth, nh = birdImg.naturalHeight;
      const k = Math.min(1, 128 / Math.max(nw, nh));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(nw * k));
      c.height = Math.max(1, Math.round(nh * k));
      const g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(birdImg, 0, 0, c.width, c.height);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          if (d[(y * c.width + x) * 4 + 3] > 10) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX >= minX && maxY >= minY) {
        birdBox = {
          x: minX / k, y: minY / k,
          w: (maxX - minX + 1) / k, h: (maxY - minY + 1) / k
        };
      }
    } catch (e) {
      birdBox = null;
    }
  }

  birdImg.onload = () => { birdReady = true; birdBox = null; measureBirdBox(); };
  birdImg.onerror = () => {
    birdReady = false;
    birdBox = null;
    if (birdImg.src.indexOf(BIRD_FALLBACK) === -1) birdImg.src = BIRD_FALLBACK;
  };
  birdImg.src = BIRD_IMAGE;

  // ---- Ses efektleri ----
  // iOS Safari sesi ancak kullanıcı dokunuşunda açar; bu yüzden ilk dokunuşta
  // AudioContext'i senkron olarak oluşturup resume ediyoruz.
  let audioCtx = null, noiseBuf = null, soundLevel = 2; // 0: kapalı, 1: kısık, 2: tam
  try {
    const savedLevel = localStorage.getItem('ozgeFlappySoundLevel');
    if (savedLevel !== null && isFinite(Number(savedLevel))) {
      soundLevel = Math.max(0, Math.min(2, Number(savedLevel)));
    } else if (localStorage.getItem('ozgeFlappyMuted') === '1') {
      soundLevel = 0; // eski tercihi de tanı
    }
  } catch (e) {}

  const VOL = [0, 0.45, 1];
  function applySoundLevel() {
    try { localStorage.setItem('ozgeFlappySoundLevel', String(soundLevel)); } catch (e) {}
    const icons = ['🔇', '🔈', '🔊'];
    const labels = ['Ses: kapalı', 'Ses: kısık', 'Ses: tam'];
    soundToggle.textContent = icons[soundLevel];
    soundToggle.title = labels[soundLevel];
    soundToggle.setAttribute('aria-label', labels[soundLevel]);
  }
  applySoundLevel();

  function unlockAudio() {
    if (soundLevel === 0) return null;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  function tone(freq, duration, type, vol, slideTo) {
    const ac = unlockAudio();
    if (!ac) return;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const level = (vol || 0.1) * VOL[soundLevel];
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(level, t + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t + duration + 0.02);
  }

  // Flappy Bird'deki kanat sesi: kısa, filtrelenmiş "pıst" + hafif aşağı kayan ton.
  function wingSound() {
    const ac = unlockAudio();
    if (!ac) return;
    const t = ac.currentTime;
    if (!noiseBuf) {
      const len = Math.floor(ac.sampleRate * 0.2);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.8;
    filter.frequency.setValueAtTime(1300, t);
    filter.frequency.exponentialRampToValueAtTime(450, t + 0.09);
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.26 * VOL[soundLevel], t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    src.start(t); src.stop(t + 0.12);
    tone(640, 0.09, 'triangle', 0.09, 320);
  }
  function pointSound() {
    tone(880, 0.09, 'sine', 0.1, 1180);
    setTimeout(() => tone(1320, 0.11, 'sine', 0.08), 70);
  }
  function hitSound() {
    tone(190, 0.28, 'sawtooth', 0.12, 70);
    tone(95, 0.32, 'square', 0.06, 50);
  }
  function happyTune() {
    if (soundLevel === 0) return;
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'sine', 0.08), i * 130));
  }

  soundToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    soundLevel = (soundLevel + 1) % 3; // kapalı → kısık → tam → kapalı
    applySoundLevel();
    if (soundLevel > 0) {
      unlockAudio();                       // kullanıcı dokunuşuyla sesi yeniden aç
      tone(880, 0.09, 'sine', 0.08, 1100); // seviyeyi doğrulayan kısa ses
    }
  });

  // ---- Oyun ----
  // Tüm değerler "birim / saniye" cinsindendir; kare hızından bağımsızdır.
  const GRAVITY = 1150;
  const FLAP = -380;
  const MAX_FALL = 560;
  const PIPE_W = 70;
  const PIPE_GAP = 195;
  const PIPE_SPEED = 175;
  const PIPE_INTERVAL = 1.7;
  const STEP = 1 / 60; // sabit fizik adımı

  let state = 'start';
  let bird, pipes, score, best, pipeTimer, clouds, confetti, groundOffset, frame;
  let paused = false;

  // Puan arttıkça borular yavaşça hızlanır (en fazla +80 birim/sn).
  function currentSpeed() {
    return PIPE_SPEED + Math.min(80, score * 3);
  }

  best = Number(localStorage.getItem('ozgeFlappyBest') || 0);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  resize();

  function makeConfetti(n) {
    const colors = ['#ff5c8a', '#ffd43b', '#7ef9ff', '#b985ff', '#69db7c', '#fff'];
    const out = [];
    for (let i = 0; i < n; i++) {
      out.push({
        x: Math.random() * W,
        y: Math.random() * H - H,
        w: 5 + Math.random() * 7,
        h: 8 + Math.random() * 8,
        vy: 0.7 + Math.random() * 1.4,
        vx: (Math.random() - 0.5) * 1.2,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.12,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    return out;
  }

  function burst(x, y) {
    const colors = ['#ff5c8a', '#ffd43b', '#7ef9ff', '#fff'];
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random() * 3;
      confetti.push({
        x: x, y: y, w: 5, h: 7,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        rot: 0, vr: (Math.random() - 0.5) * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 0.75
      });
    }
  }

  // 5, 10, 20, 30... puanlarda küçük kutlama.
  function celebrate(newScore) {
    const milestones = [5, 10, 20, 30, 50, 75, 100];
    if (milestones.indexOf(newScore) === -1) return;
    for (let i = 0; i < 4; i++) {
      setTimeout(() => burst(40 + Math.random() * (W - 80), 60 + Math.random() * (H * 0.5)), i * 90);
    }
    happyTune();
  }

  function reset() {
    bird = { x: 110, y: H / 2, prevY: H / 2, vy: 0, rot: 0, r: 20, flapFx: 0 };
    pipes = [];
    score = 0;
    pipeTimer = 0;
    groundOffset = 0;
    frame = 0;
    clouds = [
      { x: 50, y: 85, s: 1 },
      { x: 260, y: 150, s: .7 },
      { x: 340, y: 55, s: .85 }
    ];
    confetti = makeConfetti(30);
  }
  reset();

  function startGame() {
    unlockAudio(); // iOS'ta ilk dokunuşta sesi kilitle
    reset();
    state = 'playing';
    setPaused(false);
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    bird.vy = FLAP;
    bird.flapFx = 1;
    wingSound();
    happyTune();
  }

  function setPaused(value) {
    paused = value;
    pauseOverlay.classList.toggle('hidden', !value);
    pauseToggle.textContent = value ? '▶' : '⏸';
    const label = value ? 'Devam et' : 'Duraklat';
    pauseToggle.title = label;
    pauseToggle.setAttribute('aria-label', label);
    if (value) accumulator = 0;
  }

  function flap() {
    if (paused) return; // duraklatıyken ekrana dokunmak kuşu oynatmaz
    if (state !== 'playing') { startGame(); return; }
    bird.vy = FLAP;
    bird.flapFx = 1;             // anlık "pop" hissi
    wingSound();
    // Android/Chrome'da hafif titreyiş; iOS Safari desteklemez, sessizce geçer.
    if (navigator.vibrate) navigator.vibrate(12);
  }

  function gameOver() {
    state = 'over';
    if (paused) setPaused(false);
    hitSound();
    const isRecord = score > best;
    if (isRecord) {
      best = score;
      localStorage.setItem('ozgeFlappyBest', String(best));
    }
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    startBestEl.textContent = 'En iyi: ' + best;
    newRecordEl.style.display = isRecord && score > 0 ? 'block' : 'none';
    setTimeout(() => gameOverScreen.classList.remove('hidden'), 250);
  }

  function addPipe() {
    const groundY = H - 70;
    const minTop = 60;
    const maxTop = Math.max(minTop + 1, groundY - PIPE_GAP - 50);
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: W + 10, prevX: W + 10, top: top, scored: false });
  }

  // dt = sabit fizik adımı (saniye). Kare hızı düşse de oyun aynı hızda ilerler.
  function update(dt) {
    frame++;
    const move = currentSpeed() * dt;
    groundOffset = (groundOffset + move) % 40;

    for (const c of clouds) {
      c.x -= 15 * c.s * dt;
      if (c.x < -70) c.x = W + 60;
    }

    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx * 60 * dt;
      c.y += c.vy * 60 * dt;
      c.rot += c.vr * 60 * dt;
      if (c.life) {
        c.life -= dt;
        c.vy += 4.8 * dt;
        if (c.life <= 0) confetti.splice(i, 1);
      } else if (c.y > H + 15) {
        c.y = -15;
        c.x = Math.random() * W;
      }
    }

    if (state !== 'playing') {
      if (state === 'start') {
        bird.y = H / 2 + Math.sin(frame / 18) * 12;
        bird.rot = Math.sin(frame / 18) * 0.15;
      }
      return;
    }

    bird.prevY = bird.y;
    bird.vy = Math.min(MAX_FALL, bird.vy + GRAVITY * dt);
    bird.y += bird.vy * dt;
    if (bird.flapFx > 0) bird.flapFx = Math.max(0, bird.flapFx - dt * 5);
    // Sadece kafa olduğu için eğimi yumuşak tut: yaklaşık -11° .. +24°
    bird.rot = Math.max(-0.20, Math.min(0.42, bird.vy * 0.045));

    // Borular artık aynı fizik saatinde üretiliyor: kare düşerse üst üste binmez.
    pipeTimer += dt;
    if (pipeTimer >= PIPE_INTERVAL) {
      addPipe();
      pipeTimer -= PIPE_INTERVAL;
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.prevX = p.x;
      p.x -= move;

      if (!p.scored && p.x + PIPE_W < bird.x - bird.r) {
        p.scored = true;
        score++;
        burst(bird.x, bird.y);
        celebrate(score);
        pointSound();
      }

      const inX = bird.x + bird.r * 0.8 > p.x && bird.x - bird.r * 0.8 < p.x + PIPE_W;
      if (inX && (bird.y - bird.r * 0.8 < p.top || bird.y + bird.r * 0.8 > p.top + PIPE_GAP)) {
        gameOver();
        return;
      }
      if (p.x + PIPE_W < -10) pipes.splice(i, 1);
    }

    if (bird.y + bird.r >= H - 70 || bird.y - bird.r <= 0) {
      bird.y = Math.min(bird.y, H - 70 - bird.r);
      gameOver();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPipe(p, alpha) {
    const bottomY = p.top + PIPE_GAP;
    const px = p.prevX + (p.x - p.prevX) * alpha;
    const edge = lowQuality ? () => {} : () => ctx.stroke();
    ctx.save();
    ctx.translate(px, 0); // gradyanı her boru için yeniden oluşturmaya gerek yok
    ctx.fillStyle = pipeGrad;
    ctx.strokeStyle = '#7a0d38';
    ctx.lineWidth = 3;

    // Kurdeleli doğum günü "boruları"
    roundRect(-4, p.top - 28, PIPE_W + 8, 28, 5); ctx.fill(); edge();
    roundRect(0, -10, PIPE_W, p.top + 10, 4); ctx.fill(); edge();
    roundRect(-4, bottomY, PIPE_W + 8, 28, 5); ctx.fill(); edge();
    roundRect(0, bottomY + 22, PIPE_W, H - bottomY, 4); ctx.fill(); edge();

    if (!lowQuality) {
      // Boruların üzerindeki küçük şenlik detayı
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(10, 0, 8, Math.max(0, p.top - 30));
      ctx.fillRect(10, bottomY + 30, 8, Math.max(0, H - bottomY - 30));
    }
    ctx.restore();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 20 * s, y - 8 * s, 24 * s, 0, Math.PI * 2);
    ctx.arc(x + 45 * s, y, 17 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y + 10 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawConfetti() {
    if (lowQuality) return;
    for (const c of confetti) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
  }

  function drawBird(alpha) {
    ctx.save();
    const by = state === 'playing'
      ? bird.prevY + (bird.y - bird.prevY) * alpha
      : bird.y;
    ctx.translate(bird.x, by);
    ctx.rotate(bird.rot);
    // Kanat çırpma anında hafif "sıkışma"; dokunuşa görsel karşılık verir.
    const fx = bird.flapFx || 0;
    if (fx > 0) ctx.scale(1 + fx * 0.07, 1 - fx * 0.05);
    const size = 58;

    if (birdReady) {
      const box = birdBox || { x: 0, y: 0, w: birdImg.naturalWidth, h: birdImg.naturalHeight };
      let sx = box.x, sy = box.y, sw = box.w, sh = box.h, dx, dy, dw, dh;
      if (BIRD_FIT === 'contain') {
        // Şeffaf kenarları kırp, kafayı oranı bozmadan tam ortaya sığdır
        const scale = Math.min(size / sw, size / sh);
        dw = sw * scale; dh = sh * scale;
        dx = -dw / 2; dy = -dh / 2;
      } else {
        // Kare görsel istenirse kafanın ortasından kırp
        const s = Math.min(sw, sh);
        sx = box.x + (sw - s) / 2; sy = box.y + (sh - s) / 2; sw = sh = s;
        dx = -size / 2; dy = -size / 2; dw = dh = size;
      }
      ctx.save();
      ctx.globalAlpha = .25;
      ctx.drawImage(birdImg, sx, sy, sw, sh, dx + 3, dy + 4, dw, dh);
      ctx.restore();
      ctx.drawImage(birdImg, sx, sy, sw, sh, dx, dy, dw, dh);
    } else {
      // Ne PNG ne JPG yüklenemezse yerleşik doğum günü kuşu
      ctx.fillStyle = '#ffd43b';
      ctx.strokeStyle = '#a05a00';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(9, -6, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(12, -6, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff922b';
      ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-34, 5); ctx.lineTo(-20, 10); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCake(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    // tabak
    ctx.fillStyle = '#f8f0ff';
    ctx.beginPath(); ctx.ellipse(0, 30, 55, 10, 0, 0, Math.PI * 2); ctx.fill();
    // kek
    ctx.fillStyle = '#ff9ec4';
    roundRect(-42, -10, 84, 40, 8); ctx.fill();
    ctx.fillStyle = '#fff0f6';
    roundRect(-42, -12, 84, 12, 6); ctx.fill();
    // mumlar
    for (let i = -1; i <= 1; i++) {
      const cx = i * 22;
      ctx.fillStyle = i === 0 ? '#7ef9ff' : '#ffe066';
      ctx.fillRect(cx - 4, -34, 8, 22);
      ctx.fillStyle = '#ff922b';
      ctx.beginPath(); ctx.ellipse(cx, -36, 5, 8, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    // Kareler arası enterpolasyon: 60/120 Hz'de hareket daha akıcı görünür.
    const alpha = Math.max(0, Math.min(1, accumulator / STEP));
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    for (const c of clouds) drawCloud(c.x, c.y, c.s);
    drawConfetti();

    for (const p of pipes) drawPipe(p, alpha);

    drawBird(alpha);

    // Zemin = doğum günü masası
    ctx.fillStyle = '#f3e3ff';
    ctx.fillRect(0, H - 70, W, 70);
    ctx.fillStyle = '#e91e63';
    ctx.fillRect(0, H - 70, W, 12);
    ctx.fillStyle = '#ffd43b';
    for (let x = -groundOffset; x < W; x += 40) {
      ctx.fillRect(x, H - 58, 22, 6);
    }
    drawCake(35, H - 112, 0.55);
    drawCake(W - 35, H - 112, 0.55);

    // Skor: üstteki düğmelerle çakışmasın diye ortada, sadece oyun sırasında görünür.
    if (state === 'playing') {
      const sx = W / 2, sy = scoreDrawY;
      ctx.textAlign = 'center';
      ctx.font = 'bold 36px "Trebuchet MS", sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(122,13,56,.55)';
      ctx.strokeText(String(score), sx, sy);
      ctx.fillStyle = '#fff';
      ctx.fillText(String(score), sx, sy);
      ctx.font = 'bold 12px "Trebuchet MS", sans-serif';
      ctx.fillStyle = '#8b1e52';
      ctx.fillText('PUAN', sx, sy + 16);
    }
  }

  let lastTime = performance.now();
  let accumulator = 0;
  let perfTime = 0, perfFrames = 0, qualityStage = 0;

  // Telefon kare hızı düşürürse çizim kalitesini kademeli azalt, oyun hızını koru.
  function watchPerf(dt) {
    if (qualityStage >= 2) return;
    perfTime += dt;
    perfFrames++;
    if (perfTime < 1.5) return;
    const fps = perfFrames / perfTime;
    perfTime = 0; perfFrames = 0;
    if (fps < 45 && qualityStage === 0) {
      qualityStage = 1;
      maxDpr = 1;      // Retina yerine 1x çizim
      resize();
    } else if (fps < 30 && qualityStage === 1) {
      qualityStage = 2;
      lowQuality = true; // konfeti ve ince detaylar kapalı
      resize();
    }
  }

  function resetClock() {
    lastTime = performance.now();
    accumulator = 0;
  }
  document.addEventListener('visibilitychange', resetClock);
  window.addEventListener('pageshow', resetClock);

  function loop(now) {
    if (!now) now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    // Sekme arka plana geçtiğinde birikmiş süre kuşu fırlatmasın.
    if (dt > 0.5) dt = 0.5;
    if (paused) {
      draw();
      requestAnimationFrame(loop);
      return;
    }
    watchPerf(dt);
    accumulator += dt;

    let steps = 0;
    while (accumulator >= STEP && steps < 30) {
      update(STEP);
      accumulator -= STEP;
      steps++;
    }
    if (steps === 30) accumulator = 0; // aşırı gecikmede takip etmeyi bırak

    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function onAction(e) {
    if (e) e.preventDefault();
    flap();
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') onAction(e);
  });
  wrap.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, a')) return;
    onAction(e);
  }, { passive: false });
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
  restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
  pauseToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state !== 'playing') return;
    setPaused(!paused);
  });
  resumeBtn.addEventListener('click', (e) => { e.stopPropagation(); setPaused(false); });

  bestScoreEl.textContent = best;
  startBestEl.textContent = 'En iyi: ' + best;

  // iOS 26 standalone: geri dönüş linki Safari'ye düşmesin, web app içinde kalsın.
  const backLink = document.getElementById('backToOzgem');
  if (backLink) {
    backLink.addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'index.html';
    });
  }
})();
</script>
</body>
