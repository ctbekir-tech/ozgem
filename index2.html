<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Özge'nin Doğum Günü - Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2b1b3d;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #gameWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 480px;
    max-height: 800px;
    overflow: hidden;
    background: #ffc2dd;
    box-shadow: 0 0 50px rgba(0,0,0,.5);
    touch-action: manipulation;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    color: #fff;
    text-align: center;
    background: rgba(58, 25, 74, .45);
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(27px, 7.5vw, 42px);
    line-height: 1.15;
    color: #fff0a8;
    text-shadow: 3px 3px 0 #b8286b, 0 0 20px rgba(255,120,180,.7);
    letter-spacing: 1px;
  }
  .overlay h1 .isim { color: #7ef9ff; text-shadow: 3px 3px 0 #146b9c, 0 0 20px rgba(90,220,255,.6); }
  .overlay p { font-size: 16px; text-shadow: 1px 1px 3px #4a1240; }
  .btn {
    margin-top: 8px;
    padding: 13px 30px;
    font: bold 20px 'Trebuchet MS', sans-serif;
    color: #8b1e52;
    background: linear-gradient(#fff3a6, #ffb3d1);
    border: 3px solid #fff;
    border-radius: 14px;
    box-shadow: 0 5px 0 #b8286b, 0 8px 16px rgba(0,0,0,.35);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b8286b; }
  .small { font-size: 13px; opacity: .9; line-height: 1.6; }
  .heart { color: #ff8fb8; }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="startScreen" class="overlay">
    <h1>İYİ Kİ DOĞDUN<br><span class="isim">ÖZGE!</span></h1>
    <p class="small">Zıplamak için boşluk tuşuna bas veya ekrana dokun.</p>
    <button id="startBtn" class="btn">BAŞLA</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color:#ffd1e6; text-shadow:3px 3px 0 #8b1e52;">OYUN BİTTİ</h1>
    <p>Puan: <b id="finalScore">0</b> &nbsp;|&nbsp; En iyi: <b id="bestScore">0</b></p>
    <p id="newRecord" class="small" style="color:#fff0a8; display:none;">Yeni rekor!</p>
    <button id="restartBtn" class="btn">TEKRAR</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('gameWrap');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const newRecordEl = document.getElementById('newRecord');

  const W = 400, H = 640;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---- Özge'nin kuşu ----
  const birdImg = new Image();
  let birdReady = false;
  birdImg.onload = () => { birdReady = true; };
  birdImg.onerror = () => { birdReady = false; };
  birdImg.src = 'kus.jpg';

  // ---- Doğum günü sesleri ----
  let audioCtx = null;
  function beep(freq, duration, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }
  function happyTune() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18), i * 130));
  }

  // ---- Oyun ----
  const GRAVITY = 0.32;
  const FLAP = -6.2;
  const PIPE_W = 70;
  const PIPE_GAP = 170;
  const PIPE_SPEED = 2.6;
  const PIPE_INTERVAL = 1500;

  let state = 'start';
  let bird, pipes, score, best, lastPipe, clouds, confetti, groundOffset, frame;

  best = Number(localStorage.getItem('ozgeFlappyBest') || 0);

  function makeConfetti(n) {
    const colors = ['#ff5c8a', '#ffd43b', '#7ef9ff', '#b985ff', '#69db7c', '#fff'];
    const out = [];
    for (let i = 0; i < n; i++) {
      out.push({
        x: Math.random() * W,
        y: Math.random() * H - H,
        w: 5 + Math.random() * 7,
        h: 8 + Math.random() * 8,
        vy: 0.7 + Math.random() * 1.4,
        vx: (Math.random() - 0.5) * 1.2,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.12,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    return out;
  }

  function burst(x, y) {
    const colors = ['#ff5c8a', '#ffd43b', '#7ef9ff', '#fff'];
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random() * 3;
      confetti.push({
        x: x, y: y, w: 5, h: 7,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        rot: 0, vr: (Math.random() - 0.5) * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 45
      });
    }
  }

  function reset() {
    bird = { x: 110, y: H / 2, vy: 0, rot: 0, r: 18 };
    pipes = [];
    score = 0;
    lastPipe = performance.now();
    groundOffset = 0;
    frame = 0;
    clouds = [
      { x: 50, y: 85, s: 1 },
      { x: 260, y: 150, s: .7 },
      { x: 340, y: 55, s: .85 }
    ];
    confetti = makeConfetti(45);
  }
  reset();

  function startGame() {
    reset();
    state = 'playing';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    bird.vy = FLAP;
    happyTune();
  }

  function flap() {
    if (state !== 'playing') { startGame(); return; }
    bird.vy = FLAP;
    beep(720, 0.08);
  }

  function gameOver() {
    state = 'over';
    beep(180, 0.35, 'square');
    const isRecord = score > best;
    if (isRecord) {
      best = score;
      localStorage.setItem('ozgeFlappyBest', String(best));
    }
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    newRecordEl.style.display = isRecord && score > 0 ? 'block' : 'none';
    setTimeout(() => gameOverScreen.classList.remove('hidden'), 250);
  }

  function addPipe() {
    const minTop = 70, maxTop = H - 160 - PIPE_GAP;
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: W + 10, top: top, scored: false });
  }

  function update() {
    frame++;
    groundOffset = (groundOffset + PIPE_SPEED) % 40;

    for (const c of clouds) {
      c.x -= 0.25 * c.s;
      if (c.x < -70) c.x = W + 60;
    }

    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx; c.y += c.vy; c.rot += c.vr;
      if (c.life) { c.life--; c.vy += 0.08; if (c.life <= 0) confetti.splice(i, 1); }
      else if (c.y > H + 15) { c.y = -15; c.x = Math.random() * W; }
    }

    if (state !== 'playing') {
      if (state === 'start') {
        bird.y = H / 2 + Math.sin(frame / 18) * 12;
        bird.rot = Math.sin(frame / 18) * 0.15;
      }
      return;
    }

    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.45, Math.min(1.35, bird.vy * 0.09));

    if (performance.now() - lastPipe > PIPE_INTERVAL) {
      addPipe();
      lastPipe = performance.now();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED;

      if (!p.scored && p.x + PIPE_W < bird.x - bird.r) {
        p.scored = true;
        score++;
        burst(bird.x, bird.y);
        beep(900, 0.09);
      }

      const inX = bird.x + bird.r * 0.8 > p.x && bird.x - bird.r * 0.8 < p.x + PIPE_W;
      if (inX && (bird.y - bird.r * 0.8 < p.top || bird.y + bird.r * 0.8 > p.top + PIPE_GAP)) {
        gameOver();
        return;
      }
      if (p.x + PIPE_W < -10) pipes.splice(i, 1);
    }

    if (bird.y + bird.r >= H - 70 || bird.y - bird.r <= 0) {
      bird.y = Math.min(bird.y, H - 70 - bird.r);
      gameOver();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPipe(p) {
    const bottomY = p.top + PIPE_GAP;
    const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    grad.addColorStop(0, '#c2185b');
    grad.addColorStop(.25, '#ff6b9d');
    grad.addColorStop(.7, '#e91e63');
    grad.addColorStop(1, '#9c1446');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#7a0d38';
    ctx.lineWidth = 3;

    // Kurdeleli doğum günü "boruları"
    roundRect(p.x - 4, p.top - 28, PIPE_W + 8, 28, 5); ctx.fill(); ctx.stroke();
    roundRect(p.x, -10, PIPE_W, p.top + 10, 4); ctx.fill(); ctx.stroke();
    roundRect(p.x - 4, bottomY, PIPE_W + 8, 28, 5); ctx.fill(); ctx.stroke();
    roundRect(p.x, bottomY + 22, PIPE_W, H - bottomY, 4); ctx.fill(); ctx.stroke();

    // Boruların üzerindeki küçük şenlik detayı
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(p.x + 10, 0, 8, Math.max(0, p.top - 30));
    ctx.fillRect(p.x + 10, bottomY + 30, 8, Math.max(0, H - bottomY - 30));
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 20 * s, y - 8 * s, 24 * s, 0, Math.PI * 2);
    ctx.arc(x + 45 * s, y, 17 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y + 10 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawConfetti() {
    for (const c of confetti) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    const size = 54;

    if (birdReady) {
      ctx.save();
      ctx.globalAlpha = .25;
      ctx.drawImage(birdImg, -size / 2 + 3, -size / 2 + 4, size, size);
      ctx.restore();
      ctx.drawImage(birdImg, -size / 2, -size / 2, size, size);
    } else {
      // kus.jpg yoksa yedek kuş
      ctx.fillStyle = '#ffd43b';
      ctx.strokeStyle = '#a05a00';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(9, -6, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(12, -6, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff922b';
      ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-34, 5); ctx.lineTo(-20, 10); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCake(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    // tabak
    ctx.fillStyle = '#f8f0ff';
    ctx.beginPath(); ctx.ellipse(0, 30, 55, 10, 0, 0, Math.PI * 2); ctx.fill();
    // kek
    ctx.fillStyle = '#ff9ec4';
    roundRect(-42, -10, 84, 40, 8); ctx.fill();
    ctx.fillStyle = '#fff0f6';
    roundRect(-42, -12, 84, 12, 6); ctx.fill();
    // mumlar
    for (let i = -1; i <= 1; i++) {
      const cx = i * 22;
      ctx.fillStyle = i === 0 ? '#7ef9ff' : '#ffe066';
      ctx.fillRect(cx - 4, -34, 8, 22);
      ctx.fillStyle = '#ff922b';
      ctx.beginPath(); ctx.ellipse(cx, -36, 5, 8, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#ffb6d9');
    sky.addColorStop(.55, '#ffd9ec');
    sky.addColorStop(1, '#ffeaf4');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    for (const c of clouds) drawCloud(c.x, c.y, c.s);
    drawConfetti();

    // Uzak Şenlik tepeleri
    ctx.fillStyle = 'rgba(255,143,184,.35)';
    ctx.beginPath();
    ctx.moveTo(0, H - 70);
    ctx.quadraticCurveTo(60, H - 125, 130, H - 70);
    ctx.quadraticCurveTo(210, H - 110, 280, H - 70);
    ctx.quadraticCurveTo(350, H - 120, W, H - 70);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

    for (const p of pipes) drawPipe(p);

    drawBird();

    // Zemin = doğum günü masası
    ctx.fillStyle = '#f3e3ff';
    ctx.fillRect(0, H - 70, W, 70);
    ctx.fillStyle = '#e91e63';
    ctx.fillRect(0, H - 70, W, 12);
    ctx.fillStyle = '#ffd43b';
    for (let x = -groundOffset; x < W; x += 40) {
      ctx.fillRect(x, H - 58, 22, 6);
    }
    drawCake(35, H - 112, 0.55);
    drawCake(W - 35, H - 112, 0.55);

    // Skor
    ctx.font = 'bold 44px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(122,13,56,.55)';
    ctx.strokeText(String(score), W / 2, 76);
    ctx.fillStyle = '#fff';
    ctx.fillText(String(score), W / 2, 76);
    ctx.font = 'bold 15px "Trebuchet MS", sans-serif';
    ctx.fillStyle = '#8b1e52';
    ctx.fillText('PUAN', W / 2, 98);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function onAction(e) {
    if (e) e.preventDefault();
    flap();
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') onAction(e);
  });
  wrap.addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    onAction(e);
  });
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
  restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

  bestScoreEl.textContent = best;
})();
</script>
</body>
</html>
