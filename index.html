<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Mini Puzzle</title>
    <style>
        body {
            background: #faf8ef;
            color: #776e65;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 50px; margin: 0; }
        .score-container {
            background: #bbada0;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
        .grid {
            width: 320px;
            height: 320px;
            background: #bbada0;
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            margin-top: 20px;
        }
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
        }
        .n2 { background: #eee4da; }
        .n4 { background: #ede0c8; }
        .n8 { background: #f2b179; color: white; }
        .n16 { background: #f59563; color: white; }
    </style>
</head>
<body>

    <h1>2048</h1>
    <div class="score-container">Skor: <span id="score">0</span></div>

    <div class="grid" id="grid">
        <!-- 4x4 Izgara Alanı -->
        <div class="cell n2">2</div>
        <div class="cell n4">4</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell n2">2</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <script>
        // Basit hazır şablon akışı
        let score = 0;
        document.addEventListener('keydown', (e) => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                score += 2;
                document.getElementById('score').innerText = score;
            }
        });
    </script>

</body>
</html>
